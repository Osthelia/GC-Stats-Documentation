name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Rebuild on demand to pick up a new OpenAPI spec without a commit.
  workflow_dispatch:
  # Lets the API repo trigger a rebuild when its spec changes.
  repository_dispatch:
    types: [openapi-updated]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  OPENAPI_SPEC_URL: https://gc-stats.app/api/openapi.json

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate API docs
        run: |
          npm run sync-openapi
          npm run gen-api-docs

      - name: Type check
        run: npx tsc --noEmit

      - name: Build site
        run: npm run build

  docker:
    name: Build & push Docker image
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scan
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: local/gc-stats-documentation:scan
          build-args: |
            OPENAPI_SPEC_URL=${{ env.OPENAPI_SPEC_URL }}
            CACHEBUST=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/gc-stats-documentation:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPENAPI_SPEC_URL=${{ env.OPENAPI_SPEC_URL }}
            CACHEBUST=${{ github.run_id }}
          cache-from: type=gha

  # Inline steps instead of the reusable workflow: this repository is public and cannot call a workflow
  # from the private Osthelia/GitOps repository. No staging for the docs: a push to main deploys to production.
  gitops:
    name: Bump gc-stats-documentation
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: gitops-bump
      cancel-in-progress: false
    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: Osthelia/GitOps
          ref: main
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}

      - name: Set tag
        env:
          IMAGE: gc-stats-documentation
          TAG: ${{ github.sha }}
          FILE: apps/production/kustomization.yaml
        run: |
          set -euo pipefail
          grep -qE "name: ghcr\.io/osthelia/${IMAGE}," "$FILE" \
            || { echo "::error::${IMAGE} not found in ${FILE}"; exit 1; }
          sed -i -E "s#(name: ghcr\.io/osthelia/${IMAGE},[[:space:]]*newTag:)[^}]*#\1 \"${TAG}\" #" "$FILE"
          grep -E "name: ghcr\.io/osthelia/${IMAGE}," "$FILE"

      - name: Commit and push
        env:
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(production): gc-stats-documentation -> ${TAG:0:7}"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          echo "::error::push failed after 3 attempts"
          exit 1
